<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DIGIT Corp — Admin Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header>
  <div class="logo">DIGIT CORP</div>
  <div class="status-bar">
    <span>PORTAL: <span>RESTRICTED</span></span>
    <span>AUTH: <span style="color:#ff3b3b;">REQUIRED</span></span>
  </div>
</header>

<div class="login-wrap">

  <div class="login-header fade-up d1">
    <h1>⛔ RESTRICTED</h1>
    <p>Admin Portal — Authorized Personnel Only</p>
  </div>

  <div class="access-denied fade-up d2">
    [ ACCESS DENIED — CREDENTIALS REQUIRED ]
  </div>

  <!-- EMP_ID: DIGIT2026 -->

  <div id="loginForm" class="fade-up d3">

    <div class="form-group">
      <label>USERNAME</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off"/>
    </div>

    <div class="form-group">
      <label>PASSWORD / EMPLOYEE ID</label>
      <input type="password" id="password" placeholder="Enter employee ID"/>
    </div>

    <div class="hint-box" style="margin-bottom:20px; font-size:0.78rem;">
      💡 <strong>Hint:</strong> Employee ID is the password.<br/>
      <span style="color:#333;">Where would an admin leave their credentials?</span>
    </div>

    <button class="btn" onclick="checkLogin()">[ AUTHENTICATE ]</button>
    <p id="msg" style="text-align:center; margin-top:16px; font-size:0.82rem; min-height:20px;"></p>

  </div>

</div>

<footer>DIGIT CORP © 2026 — UNAUTHORIZED ACCESS IS A CRIMINAL OFFENCE</footer>

<script src="script.js"></script>
</body>
</html>
