<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9; --muted:#8b949e; }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;}
  .wrap{display:flex;height:680px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0d1117;}
  .canvas{position:relative;flex:0 0 65%;border-right:1px solid var(--border);overflow:hidden;}
  .detail{flex:0 0 35%;background:var(--panel);padding:14px;overflow:auto;}
  .crumb{position:absolute;left:12px;top:12px;background:#111827;border:1px solid var(--border);padding:6px 10px;border-radius:999px;font-size:12px;color:#9ca3af;z-index:5}
  svg{width:100%;height:100%}
  .node{fill:#111827;stroke:#30363d;stroke-width:1.6;cursor:pointer}
  .nodeTxt{fill:#e5e7eb;font-size:12px;font-weight:600;text-anchor:middle}
  .subTxt{fill:#9ca3af;font-size:11px;text-anchor:middle}
  .badge{fill:#1f2937;stroke:#374151}
  .badgeText{fill:#e5e7eb;font-size:10px;text-anchor:middle;font-weight:700}
  .btn{display:inline-block;margin:4px 6px 0 0;padding:6px 10px;border-radius:8px;border:1px solid #374151;background:#111827;color:#e5e7eb;cursor:pointer;font-size:12px}
  .btn:hover{background:#1f2937}
  .stat{display:inline-block;min-width:130px;border:1px solid #30363d;padding:8px;border-radius:8px;margin:4px 6px 0 0;background:#0f172a}
  .k{font-size:11px;color:#9ca3af}.v{font-size:15px;font-weight:700}
  .bar{height:8px;background:#1f2937;border-radius:999px;margin-top:4px}
  .bar > i{display:block;height:100%;background:#388bfd;border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
  <div class="canvas">
    <div class="crumb" id="crumb">Home / Overview</div>
    <svg viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg">
      <line x1="490" y1="340" x2="220" y2="140" stroke="#30363d" />
      <line x1="490" y1="340" x2="220" y2="255" stroke="#30363d" />
      <line x1="490" y1="340" x2="220" y2="370" stroke="#30363d" />
      <line x1="490" y1="340" x2="220" y2="485" stroke="#30363d" />
      <line x1="490" y1="340" x2="760" y2="140" stroke="#30363d" />
      <line x1="490" y1="340" x2="760" y2="255" stroke="#30363d" />
      <line x1="490" y1="340" x2="760" y2="370" stroke="#30363d" />

      <circle cx="490" cy="340" r="110" fill="#0f172a" stroke="__CENTER_COLOR__" stroke-width="3" />
      <text x="490" y="310" class="nodeTxt" style="font-size:18px">__SUBJECT_NAME__</text>
      <text x="490" y="336" class="subTxt" style="font-size:14px">__SUBJECT_NUMBER__</text>
      <text x="490" y="360" class="subTxt" style="font-size:13px">__TOTAL_RECORDS__</text>
      <text x="490" y="382" class="subTxt" style="font-size:12px">__OPERATOR_LABEL__</text>

  <rect x="120" y="110" width="190" height="60" rx="12" class="node" onclick="showNode('bparty');requestFilter('B-Party / Contacts')" />
      <text x="215" y="136" class="nodeTxt">B Party</text>
      <text x="215" y="154" class="subTxt">__UNIQUE_BPARTY__ unique</text>
      <circle cx="295" cy="123" r="12" class="badge" /><text x="295" y="127" class="badgeText">__BPARTY_BRANCH_COUNT__</text>

  <rect x="120" y="225" width="190" height="60" rx="12" style="fill:__IMEI_NODE_BG__;stroke:__IMEI_NODE_COLOR__;stroke-width:1.8;cursor:pointer" onclick="showNode('imei');requestFilter('IMEI / Device')" />
      <text x="215" y="251" class="nodeTxt">IMEI / Device</text>
      <text x="215" y="269" class="subTxt">__IMEI_SECONDARY_COUNT__ secondary</text>
      <circle cx="295" cy="238" r="12" style="fill:#111827;stroke:__IMEI_NODE_COLOR__"/><text x="295" y="242" class="badgeText">__IMEI_BADGE__</text>

  <rect x="120" y="340" width="190" height="60" rx="12" class="node" onclick="showNode('towers');requestFilter('Location / Tower')" />
      <text x="215" y="366" class="nodeTxt">BTS Towers</text>
      <text x="215" y="384" class="subTxt">Movement + location</text>

  <rect x="120" y="455" width="190" height="60" rx="12" class="node" onclick="showNode('sms');requestFilter('SMS')" />
      <text x="215" y="481" class="nodeTxt">SMS</text>
      <text x="215" y="499" class="subTxt">__SMS_COUNT__ records</text>

      <rect x="670" y="110" width="190" height="60" rx="12" class="node" onclick="showNode('mutual')" />
      <text x="765" y="136" class="nodeTxt">Mutual Contacts</text>
      <text x="765" y="154" class="subTxt">__MUTUAL_SUBLABEL__</text>

  <rect x="670" y="225" width="190" height="60" rx="12" class="node" onclick="showNode('timeline');requestFilter('Date & Time')" />
      <text x="765" y="251" class="nodeTxt">Timeline</text>
      <text x="765" y="269" class="subTxt">Behavioral pattern</text>

  <rect x="670" y="340" width="190" height="60" rx="12" class="node" onclick="showNode('network');requestFilter('Call Type')" />
      <text x="765" y="366" class="nodeTxt">Network Graph</text>
      <text x="765" y="384" class="subTxt">Contact web</text>
    </svg>
  </div>
  <div class="detail" id="detail"></div>
</div>

<script>
const details = {
  default: `<h3 style="margin:0 0 8px 0">Subject Overview</h3>
    <div class="stat"><div class="k">Total Records</div><div class="v">__TOTAL_RECORDS__</div></div>
    <div class="stat"><div class="k">Voice</div><div class="v">__VOICE_COUNT__</div></div>
    <div class="stat"><div class="k">SMS</div><div class="v">__SMS_COUNT__</div></div>
    <div class="stat"><div class="k">Unique B-Party</div><div class="v">__UNIQUE_BPARTY__</div></div>
    <div style="margin-top:10px">
      <button class="btn" onclick="showNode('bparty')">B Party</button>
      <button class="btn" onclick="showNode('imei')">IMEI</button>
      <button class="btn" onclick="showNode('sms')">SMS</button>
      <button class="btn" onclick="showNode('mutual')">Mutual</button>
    </div>`,

  bparty: `<h3 style="margin:0">B Party Intelligence</h3>
    <p style="color:#9ca3af">Top contacts and communication profile</p>
    __TOP4_ROWS__
    <div style="margin-top:8px">
      <button class="btn" onclick="requestChart('call-graph')">Call Graph</button>
      <button class="btn" onclick="requestChart('daily-activity')">Daily Activity</button>
    </div>
    <div style="margin-top:8px"><button class="btn" onclick="openOsint('__TOP_CONTACT__')">OSINT Top Contact</button></div>`,

  imei: `<h3 style="margin:0">IMEI / Device</h3>
    <p style="color:#9ca3af">Primary IMEI: <b>__IMEI_PRIMARY__</b></p>
    <div class="stat"><div class="k">Primary usage</div><div class="v">__IMEI_PRIMARY_PCT__%</div></div>
    <div class="stat"><div class="k">Secondary count</div><div class="v">__IMEI_SECONDARY_COUNT__</div></div>
    <div style="margin-top:8px"><button class="btn" onclick="requestChart('imei-timeline')">IMEI Timeline</button></div>`,

  towers: `<h3 style="margin:0">BTS Towers</h3>
    <p style="color:#9ca3af">Unique towers: <b>__UNIQUE_TOWERS__</b></p>
    <button class="btn" onclick="requestChart('tower-timeline')">Tower Timeline</button>
    <button class="btn" onclick="requestChart('movement-map')">Movement Map</button>`,

  sms: `<h3 style="margin:0">SMS Intelligence</h3>
    <p style="color:#9ca3af">Commercial + Personal decode</p>
    <div class="stat"><div class="k">SMS Count</div><div class="v">__SMS_COUNT__</div></div>
    <button class="btn" onclick="requestChart('weekly-heatmap')">Weekly Heatmap</button>
    <button class="btn" onclick="requestChart('sms-company-pie')">Company Pie</button>`,

  mutual: `<h3 style="margin:0">Mutual Contacts</h3>
    <p style="color:#9ca3af">__MUTUAL_SUBLABEL__</p>
    <button class="btn" onclick="requestChart('timeline-overlap')">Timeline Overlap</button>`,

  timeline: `<h3 style="margin:0">Timeline</h3>
    <button class="btn" onclick="requestChart('daily-activity')">Daily Activity</button>
    <button class="btn" onclick="requestChart('hourly-pattern')">Hourly Pattern</button>
    <button class="btn" onclick="requestChart('silent-periods')">Silent Periods</button>
    <button class="btn" onclick="requestChart('weekly-heatmap')">Weekly Heatmap</button>`,

  network: `<h3 style="margin:0">Network Graph</h3>
    <button class="btn" onclick="requestChart('call-graph')">Call Graph</button>
    <button class="btn" onclick="requestChart('cluster-detect')">Cluster Detect</button>`
};

document.getElementById('detail').innerHTML = details.default;

function showNode(node){
  document.getElementById('crumb').innerText = `Home / ${node}`;
  document.getElementById('detail').innerHTML = details[node] || details.default;
}

function openOsint(number){
  const clean = String(number || '').replace(/\D/g,'').slice(-10);
  if(!clean) return;
  window.open(`https://www.truecaller.com/search/in/91${clean}`,'_blank');
}

// Required postMessage hook
function requestChart(chartName) {
  window.parent.postMessage({
    type: 'streamlit:setComponentValue',
    value: chartName
  }, '*');
  // fallback that works reliably with Streamlit reruns
  try {
    const p = new URLSearchParams(window.parent.location.search);
    p.set('chart', chartName);
    window.parent.history.replaceState({}, '', `${window.parent.location.pathname}?${p.toString()}`);
    window.parent.location.reload();
  } catch (e) {}
}

function requestFilter(filterBranch) {
  window.parent.postMessage({
    type: 'streamlit:setComponentValue',
    value: `filter::${filterBranch}`
  }, '*');
  try {
    const p = new URLSearchParams(window.parent.location.search);
    p.set('filter_branch', filterBranch);
    window.parent.history.replaceState({}, '', `${window.parent.location.pathname}?${p.toString()}`);
    window.parent.location.reload();
  } catch (e) {}
}
</script>
</body>
</html>
