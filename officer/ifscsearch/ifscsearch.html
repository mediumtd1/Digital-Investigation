
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFSC Code Lookup</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.13/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Font Awesome शामिल करें -->
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <style>

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        background-color: #0d0d0d;
        position: sticky;
        top: 0;
        z-index: 1000;
      }


      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
      }

      nav .logo {
        color: #00ffcc;
        font-size: 1.5em;
        font-weight: bold;
      }

      nav ul {
        list-style: none;
        display: flex;
        align-items: center;
      }

      nav ul li {
        margin: 10px;
      }

      nav ul li a {
        color: #e0e0e0;
        text-decoration: none;
        padding: 8px 10px;
        border-radius: 4px;
        transition: background-color 0.3s;
      }

      nav ul li a:hover,
      nav ul li a.active {
        background-color: #00ffcc;
        color: #000;
      }


      .hamburger {
        display: none;
        flex-direction: column;
        cursor: pointer;
      }

      .hamburger div {
        width: 25px;
        height: 3px;
        background-color: #e0e0e0;
        margin: 4px;
        transition: all 0.3s;
      }


      .nav-menu {
        display: flex;
        flex-direction: row;
      }

      .nav-menu.active {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background-color: #0d0d0d;
        padding: 10px 0;
      }

      @media (max-width: 768px) {
        .nav-menu {
          display: none;
        }

        .hamburger {
          display: flex;
        }
      }

      main {
        flex: 1;
        width: 100%;
        max-width: 1500px;
        margin: 20px auto;
        padding: 0 20px;
      }

      h1 {
        color: #00ffcc;
        text-align: center;
        font-size: 2em;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #00ffcc;
      }

      .container {
        background-color: #262626;
        padding: 20px;
        border-radius: 8px;
      }

      #ifscCodes {
        width: 100%;
        padding: 10px;
        border: 2px solid #00ffcc;
        border-radius: 8px;
        background-color: #1a1a1a;
        color: #e0e0e0;
        resize: vertical;
        min-height: 100px;
        font-family: monospace;
        overflow-wrap: break-word;
      }

      .button-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        margin-top: 10px;
      }

      .button-container button {
        background-color: #00ffcc;
        color: #000;
        width: 140px;
        padding: 10px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .button-container button:hover {
        background-color: #e0e0e0;
        color: #000;
      }

      .button-container select {
        padding: 10px;
        margin: 5px;
        border: 2px solid #00ffcc;
        border-radius: 5px;
        background-color: #1a1a1a;
        color: #e0e0e0;
        font-size: 1em;
      }

      #counter {
        text-align: right;
        margin-top: 5px;
        color: #ff3333;
      }

      .info-paragraph {
        padding: 10px;
        text-align: center;
        font-weight: bold;
      }

      .table-container {
        width: 100%;
        overflow-x: auto;
        margin-top: 20px;
      }

      #result table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
      }

      #result th,
      #result td {
        padding: 10px;
        border: 1px solid #333;
        word-wrap: break-word;
        text-align: center;
      }

      #result th {
        background-color: #00ffcc;
        color: #000;
        cursor: pointer;
        position: relative;
      }

      #result th:hover {
        background-color: #e0e0e0;
      }

      #result tr:nth-child(even) {
        background-color: #1a1a1a;
      }

      #result tr:nth-child(odd) {
        background-color: #262626;
      }

      @media (max-width: 768px) {
        .button-container {
          flex-direction: column;
        }

        .button-container button {
          width: 100%;
        }

        #ifscCodes {
          min-height: 150px;
        }

        h1 {
          font-size: 1.5em;
        }
      }


      .pop-up {
        position: absolute;
        background-color: #262626;
        box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        padding: 10px;
        z-index: 999;
        display: none;
        border-radius: 10px;
        max-height: 300px;
        overflow-y: auto;
      }

      .pop-up ul {
        list-style: none;
        padding: 0;
      }

      .pop-up li {
        padding: 5px;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
        border-radius: 5px;
        color: #e0e0e0;
      }

      .pop-up li:hover {
        background-color: #00ffcc;
        color: #000;
      }


      .active-filters {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      .active-filters .filter-tag {
        background-color: #00ffcc;
        color: #000;
        padding: 5px 10px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.9em;
      }

      .active-filters .filter-tag .remove-filter {
        cursor: pointer;
        font-weight: bold;
      }

      footer {
        background-color: #0d0d0d;
        color: #e0e0e0;
        text-align: center;
        padding: 10px;
      }


      .spinner {
        display: none;
        margin: 20px auto;
        border: 8px solid #333;
        border-top: 8px solid #00ffcc;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }


      a:focus,
      button:focus {
        outline: 2px dashed #00ffcc;
        outline-offset: 2px;
      }


      .address-cell {
        max-width: 200px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .address-cell:hover {
        white-space: normal;
        max-width: 400px;
      }

      #tableSearch {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 2px solid #00ffcc;
        border-radius: 5px;
        background-color: #1a1a1a;
        color: #e0e0e0;
        font-size: 1em;
      }

      .button-container select {
        padding: 10px;
        margin: 5px;
        border: 2px solid #00ffcc;
        border-radius: 5px;
        background-color: #1a1a1a;
        color: #e0e0e0;
        font-size: 1em;
      }


      .button-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        margin-top: 10px;
      }

      .button-container button,
      .button-container select {
        margin: 5px;
      }
    </style>
  </head>
  <body>

    <main>
      <div class="container">
        <h1>SEARCH IFSC CODE IN BULK</h1>
        <textarea
          id="ifscCodes"
          placeholder="Type IFSC Codes here..."
        ></textarea>
        <div id="counter">0/0</div>

        <div class="button-container">
          <button onclick="fetchBankDetails()">
            <i class="fas fa-search"></i> SEARCH IFSC
          </button>
          <button onclick="clearData()">
            <i class="fas fa-eraser"></i> Clear Form
          </button>
          
        </div>
        <p class="info-paragraph">
          Note: Hover over the Bank, City, District, and State column headers to
          display unique records with their counts. Click on headers to sort,
          and you can apply filters by clicking on pop-up values.
        </p>
        <div id="loadingSpinner" class="spinner"></div>
        <div class="pop-up" id="popUp"></div>
        <div class="active-filters" id="activeFilters"></div>
        <!-- सर्च बॉक्स जोड़ा गया -->
        <input
          type="text"
          id="tableSearch"
          placeholder="Search in table..."
          onkeyup="searchTable()"
          style="display: none"
        />
        <div class="table-container" id="result"></div>
      </div>
    </main>
    <footer>
      &copy; 2024. All rights reserved.
    </footer>
    <script>
      // JavaScript Code for IFSC Code Lookup

      // Initialize variables to keep track of sort directions, selected filters, and fetched data
      let sortDirection = {};
      let selectedValues = {};
      let dataCache = [];

      // Function to toggle the mobile hamburger menu
      function toggleMenu() {
        const navMenu = document.querySelector(".nav-menu");
        navMenu.classList.toggle("active");
        const hamburger = document.querySelector(".hamburger");
        hamburger.classList.toggle("active");
      }

      // Function to fetch bank details based on IFSC codes
      const fetchBankDetails = async () => {
        const textarea = document.getElementById("ifscCodes");
        // Extract unique IFSC codes using regex and convert to uppercase
        const ifscCodes = [
          ...new Set(textarea.value.match(/[A-Z]{4}0[0-9A-Z]{6}/gi) || []),
        ];
        const resultDiv = document.getElementById("result");
        const spinner = document.getElementById("loadingSpinner");

        // If no valid IFSC codes are found, display an error message
        if (ifscCodes.length === 0) {
          resultDiv.innerHTML =
            '<p style="color:red;">Please enter at least one valid IFSC code.</p>';
          return;
        }

        // Show the loading spinner while fetching data
        spinner.style.display = "block";

        // Create an array of promises to fetch data for each IFSC code
        const promises = ifscCodes.map(async (ifscCode) => {
          try {
            const response = await fetch(
              `https://ifsc.razorpay.com/${ifscCode.trim().toUpperCase()}`
            );
            if (response.ok) {
              const data = await response.json();
              return data;
            } else {
              console.error("Error fetching details for IFSC code:", ifscCode);
              return null;
            }
          } catch (error) {
            console.error("Error fetching details for IFSC code:", ifscCode);
            return null;
          }
        });

        // Wait for all fetch requests to complete
        const results = await Promise.all(promises);
        // Filter out any null responses (failed fetches)
        dataCache = results.filter((res) => res !== null);
        // Build the results table with the fetched data
        buildTable(dataCache);
        // Hide the loading spinner after fetching data
        spinner.style.display = "none";
        // Update the row count display
        updateRowCount();
      };

      // Function to build the results table with fetched data
      const buildTable = (data) => {
        let result = `<table id='dataTable'>
      <thead>
      <tr>
          <th onclick='sortTable(0)'>IFSC</th>
          <th onclick='sortTable(1)' onmouseover='showPopUp(1)' onmouseout='hidePopUp()'>BANK</th>
          <th onclick='sortTable(2)'>BRANCH</th>
          <th onclick='sortTable(3)'>ADDRESS</th>
          <th onclick='sortTable(4)'>CENTRE</th>
          <th onclick='sortTable(5)' onmouseover='showPopUp(5)' onmouseout='hidePopUp()'>CITY</th>
          <th onclick='sortTable(6)' onmouseover='showPopUp(6)' onmouseout='hidePopUp()'>DISTRICT</th>
          <th onclick='sortTable(7)' onmouseover='showPopUp(7)' onmouseout='hidePopUp()'>STATE</th>
          <th onclick='sortTable(8)'>CONTACT</th>
      </tr>
      </thead>
      <tbody>
  `;
        data.forEach((response) => {
          result += `
          <tr>
              <td>${response.IFSC}</td>
              <td>${response.BANK}</td>
              <td>${response.BRANCH}</td>
              <td class="address-cell">${response.ADDRESS}</td>
              <td>${response.CENTRE}</td>
              <td>${response.CITY}</td>
              <td>${response.DISTRICT}</td>
              <td>${response.STATE}</td>
              <td>${response.CONTACT || "N/A"}</td>
          </tr>
      `;
        });
        result += "</tbody></table>";
        document.getElementById("result").innerHTML = result;

        // Show or hide the copy, download buttons and search box
        if (data.length > 0) {
          document.getElementById("copyButton-ifsc").style.display =
            "inline-block";
          document.getElementById("downloadButton").style.display =
            "inline-block";
          document.getElementById("fileFormat").style.display = "inline-block";
          document.getElementById("tableSearch").style.display = "block";
        } else {
          document.getElementById("copyButton-ifsc").style.display = "none";
          document.getElementById("downloadButton").style.display = "none";
          document.getElementById("fileFormat").style.display = "none";
          document.getElementById("tableSearch").style.display = "none";
        }
      };

      // Function to update the row count display
      const updateRowCount = () => {
        const tableRows = document.querySelectorAll("#dataTable tbody tr");
        const totalRows = dataCache.length;
        const visibleRows = Array.from(tableRows).filter(
          (row) => row.style.display !== "none"
        ).length;
        document.getElementById(
          "counter"
        ).textContent = `${visibleRows}/${totalRows}`;
      };

      // Function to sort the table based on the clicked column
      const sortTable = (columnIndex) => {
        const table = document.getElementById("dataTable");
        const tbody = table.querySelector("tbody");
        const rows = Array.from(tbody.querySelectorAll("tr"));
        const dir = sortDirection[columnIndex] === "asc" ? "desc" : "asc";
        sortDirection[columnIndex] = dir;

        rows.sort((a, b) => {
          const cellA = a.children[columnIndex].innerText.toLowerCase();
          const cellB = b.children[columnIndex].innerText.toLowerCase();
          if (cellA < cellB) {
            return dir === "asc" ? -1 : 1;
          }
          if (cellA > cellB) {
            return dir === "asc" ? 1 : -1;
          }
          return 0;
        });

        // Re-append sorted rows to the tbody
        tbody.innerHTML = "";
        rows.forEach((row) => tbody.appendChild(row));
      };

      // Function to show the pop-up filter menu when hovering over certain headers
      const showPopUp = (columnIndex) => {
        const table = document.getElementById("dataTable");
        const rows = table.querySelectorAll("tbody tr");
        const counts = {};

        // Count the occurrences of each unique value in the specified column
        rows.forEach((row) => {
          const cellText = row.children[columnIndex].innerText;
          if (row.style.display !== "none") {
            counts[cellText] = (counts[cellText] || 0) + 1;
          }
        });

        const popUp = document.getElementById("popUp");
        let popUpContent = "<ul>";
        Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .forEach(([key, value]) => {
            popUpContent += `<li onclick='toggleFilter(${columnIndex}, "${key}")'>${key}: ${value}</li>`;
          });
        popUpContent += "</ul>";
        popUp.innerHTML = popUpContent;

        // Position the pop-up below the header cell
        const header = table.querySelectorAll("th")[columnIndex];
        const headerRect = header.getBoundingClientRect();
        popUp.style.top = `${headerRect.bottom + window.scrollY}px`;
        popUp.style.left = `${headerRect.left + window.scrollX}px`;
        popUp.style.display = "block";

        // Ensure the pop-up remains visible when hovered over
        popUp.onmouseover = () => (popUp.style.display = "block");
        popUp.onmouseleave = () => (popUp.style.display = "none");
      };

      // Function to hide the pop-up filter menu
      const hidePopUp = () => {
        document.getElementById("popUp").style.display = "none";
      };

      // Function to toggle filters based on user selection
      const toggleFilter = (columnIndex, value) => {
        const table = document.getElementById("dataTable");
        const rows = table.querySelectorAll("tbody tr");

        // Toggle the selection status of the filter value
        if (selectedValues[value]) {
          delete selectedValues[value];
          removeActiveFilterTag(columnIndex, value);
        } else {
          selectedValues[value] = true;
          addActiveFilterTag(columnIndex, value);
        }

        // Check if any filters are active
        if (Object.keys(selectedValues).length === 0) {
          // If no filters are active, display all rows
          rows.forEach((row) => {
            row.style.display = "";
          });
        } else {
          // Show or hide rows based on the selected filters
          rows.forEach((row) => {
            const cellText = row.children[columnIndex].innerText;
            if (selectedValues[cellText]) {
              row.style.display = "";
            } else {
              row.style.display = "none";
            }
          });
        }

        // Update the row count display
        updateRowCount();
      };

      // Function to add active filter tags above the table
      const addActiveFilterTag = (columnIndex, value) => {
        const activeFiltersDiv = document.getElementById("activeFilters");
        const filterTag = document.createElement("div");
        filterTag.className = "filter-tag";
        filterTag.dataset.column = columnIndex;
        filterTag.dataset.value = value;
        filterTag.innerHTML = `${value} <span class="remove-filter" onclick="removeFilter(${columnIndex}, '${value}')">&times;</span>`;
        activeFiltersDiv.appendChild(filterTag);
      };

      // Function to remove active filter tags
      const removeActiveFilterTag = (columnIndex, value) => {
        const activeFiltersDiv = document.getElementById("activeFilters");
        const filterTags = activeFiltersDiv.querySelectorAll(".filter-tag");
        filterTags.forEach((tag) => {
          if (
            tag.dataset.column == columnIndex &&
            tag.dataset.value === value
          ) {
            activeFiltersDiv.removeChild(tag);
          }
        });
      };

      // Function to remove a specific filter when the '×' icon is clicked
      const removeFilter = (columnIndex, value) => {
        if (selectedValues[value]) {
          delete selectedValues[value];
          const table = document.getElementById("dataTable");
          const rows = table.querySelectorAll("tbody tr");

          // Check if any filters are still active
          if (Object.keys(selectedValues).length === 0) {
            // If no filters are active, display all rows
            rows.forEach((row) => {
              row.style.display = "";
            });
          } else {
            // Show or hide rows based on the updated filters
            rows.forEach((row) => {
              const cellText = row.children[columnIndex].innerText;
              if (selectedValues[cellText]) {
                row.style.display = "";
              } else {
                row.style.display = "none";
              }
            });
          }

          // Remove the corresponding filter tag
          removeActiveFilterTag(columnIndex, value);
          // Update the row count display
          updateRowCount();
        }
      };

      // Function to clear all data, filters, and reset the interface
      const clearData = () => {
        document.getElementById("ifscCodes").value = "";
        document.getElementById("result").innerHTML = "";
        document.getElementById("counter").textContent = "0/0";
        dataCache = [];
        selectedValues = {};
        document.getElementById("copyButton-ifsc").style.display = "none";
        document.getElementById("downloadButton").style.display = "none";
        document.getElementById("fileFormat").style.display = "none";
        document.getElementById("activeFilters").innerHTML = "";
        document.getElementById("tableSearch").value = "";
        document.getElementById("tableSearch").style.display = "none";
      };

      // Function to copy the results table to the clipboard
      const copyData = () => {
        const resultDiv = document.getElementById("result");
        const range = document.createRange();
        range.selectNode(resultDiv);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        try {
          document.execCommand("copy");
          const copyButton = document.getElementById("copyButton-ifsc");
          copyButton.innerHTML = '<i class="fas fa-check"></i> Data Copied';
          copyButton.disabled = true;
          setTimeout(() => {
            copyButton.innerHTML = '<i class="fas fa-copy"></i> Copy Table';
            copyButton.disabled = false;
          }, 2000);
        } catch (err) {
          console.error("Unable to copy", err);
        }
        selection.removeAllRanges();
      };

      // Function to download the results table as Excel or PDF
      const downloadData = () => {
        const fileFormat = document.getElementById("fileFormat").value;
        const table = document.getElementById("dataTable");
        if (fileFormat === "xlsx") {
          const wb = XLSX.utils.table_to_book(table);
          XLSX.writeFile(wb, "IFSC_Data.xlsx");
        } else if (fileFormat === "pdf") {
          const doc = new jsPDF();
          doc.autoTable({ html: "#dataTable" });
          doc.save("IFSC_Data.pdf");
        }
      };

      // Function to perform live search in the table
      function searchTable() {
        const input = document.getElementById("tableSearch");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("dataTable");
        const tr = table.getElementsByTagName("tr");

        // Loop through all table rows, and hide those who don't match the search query
        for (let i = 1; i < tr.length; i++) {
          const tds = tr[i].getElementsByTagName("td");
          let rowContainsFilter = false;
          for (let j = 0; j < tds.length; j++) {
            const td = tds[j];
            if (td) {
              const txtValue = td.textContent || td.innerText;
              if (txtValue.toUpperCase().indexOf(filter) > -1) {
                rowContainsFilter = true;
                break;
              }
            }
          }
          tr[i].style.display = rowContainsFilter ? "" : "none";
        }
        updateRowCount();
      }

      // Event listener to handle input in the IFSC codes textarea
      document
        .getElementById("ifscCodes")
        .addEventListener("input", function () {
          const textareaContent = this.value;
          // Convert user input to uppercase
          const uppercaseContent = textareaContent.toUpperCase();
          // Allow manual input of IFSC codes without modifying the input
          const ifscCodes = uppercaseContent
            .split(",")
            .map((code) => code.trim());
          const uniqueIfscCodes = [...new Set(ifscCodes)];
          this.value = uniqueIfscCodes.join(", ");
          // Reset the row count since new codes are entered
          document.getElementById(
            "counter"
          ).textContent = `0/${uniqueIfscCodes.length}`;
        });

      // Event listener to handle paste events in the IFSC codes textarea
      document
        .getElementById("ifscCodes")
        .addEventListener("paste", function (e) {
          e.preventDefault();
          const pasteData = e.clipboardData.getData("Text");
          // Extract IFSC codes from the pasted content
          const ifscCodes = pasteData.match(/[A-Z]{4}0[0-9A-Z]{6}/gi) || [];
          const uniqueIfscCodes = [...new Set(ifscCodes)];
          this.value = uniqueIfscCodes.join(", ");
          // Update the row count based on pasted IFSC codes
          document.getElementById(
            "counter"
          ).textContent = `0/${uniqueIfscCodes.length}`;
        });

      // Event listener to clear pop-up filters when clicking outside the table or pop-up
      document.body.addEventListener("click", function (event) {
        const popUp = document.getElementById("popUp");
        if (!event.target.closest(".pop-up") && !event.target.closest("th")) {
          hidePopUp();
        }
      });
    </script>
  </body>
</html>
